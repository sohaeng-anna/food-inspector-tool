<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>TB MED 530 Inspector Tool</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, sans-serif;
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
      background: #f8fafc;
    }

    h2 {
      color: #1e3a8a;
      text-align: center;
      margin-bottom: 15px;
    }

    .box {
      background: white;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      margin-bottom: 12px;
    }

    input,
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 15px;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    button {
      background: #1e3a8a;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 10px;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .res-box {
      display: none;
      background: #f1f5f9;
      padding: 12px;
      border-radius: 6px;
      margin-top: 12px;
    }

    .res-title {
      font-weight: bold;
      margin-top: 12px;
      font-size: 13px;
      color: #475569;
    }

    .res-val {
      background: white;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
      margin-top: 3px;
      white-space: pre-wrap;
      line-height: 1.5;
      border: 1px solid #e2e8f0;
    }

    .btn-copy {
      background: #334155;
      margin-top: 15px;
    }

    #status {
      text-align: center;
      color: #2563eb;
      font-size: 13px;
      margin-top: 10px;
      line-height: 1.5;
    }

    .notice {
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<h2>📋 TB MED 530 Inspector Tool</h2>


<!-- API KEY -->
<div class="box">

  <label>
    <b>Gemini API Key:</b>
  </label>

  <div style="display:flex; gap:6px;">

    <input
      type="password"
      id="apiKey"
      placeholder="Google AI Studio API Key 입력"
    >

    <button
      onclick="saveKey()"
      style="
        width:70px;
        margin-top:6px;
        background:#475569;
      "
    >
      저장
    </button>

  </div>

  <div class="notice">
    API Key는 현재 브라우저의 localStorage에 저장됩니다.
  </div>

</div>


<!-- INSPECTION -->
<div class="box">

  <label>
    <b>현장 상황 메모:</b>
  </label>

  <textarea
    id="memo"
    placeholder="예: RIF 온도가 화씨 45도임"
  ></textarea>


  <label
    style="
      margin-top:12px;
      display:block;
    "
  >
    <b>현장 사진 첨부 (선택):</b>
  </label>

  <input
    type="file"
    id="pic"
    accept="image/*"
    capture="environment"
  >


  <button
    id="runBtn"
    onclick="runAnalysis()"
  >
    DEF / REC 생성하기
  </button>


  <div id="status"></div>


  <!-- RESULTS -->
  <div
    class="res-box"
    id="resultArea"
  >

    <div class="res-title">
      REF (Reference)
    </div>

    <div
      class="res-val"
      id="outRef"
    ></div>


    <div
      class="res-title"
      style="color:#dc2626;"
    >
      DEF (Deficiency)
    </div>

    <div
      class="res-val"
      id="outDef"
    ></div>


    <div
      class="res-title"
      style="color:#16a34a;"
    >
      REC (Recommendation)
    </div>

    <div
      class="res-val"
      id="outRec"
    ></div>


    <button
      class="btn-copy"
      onclick="copyAll()"
    >
      전체 영문 복사
    </button>

  </div>

</div>


<script>

/* =====================================================
   API KEY
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    const savedKey =
      localStorage.getItem("API_KEY");

    if (savedKey) {
      document.getElementById("apiKey").value =
        savedKey;
    }

  }
);


function saveKey() {

  const key =
    document
      .getElementById("apiKey")
      .value
      .trim();

  if (!key) {

    alert("API Key를 입력해줘!");

    return;

  }

  localStorage.setItem(
    "API_KEY",
    key
  );

  alert("API Key가 저장되었어!");

}



/* =====================================================
   IMAGE
===================================================== */

let imageBase64 = null;
let imageMime = null;


document
  .getElementById("pic")
  .addEventListener(
    "change",
    (event) => {

      const file =
        event.target.files[0];

      imageBase64 = null;
      imageMime = null;

      if (!file) {
        return;
      }


      /* 이미지 크기 제한 */
      if (file.size > 10 * 1024 * 1024) {

        alert(
          "사진 크기가 너무 커. 10MB 이하 사진을 사용해줘."
        );

        event.target.value = "";

        return;
      }


      imageMime =
        file.type || "image/jpeg";


      const reader =
        new FileReader();


      reader.onload =
        (e) => {

          const result =
            e.target.result;

          imageBase64 =
            result.substring(
              result.indexOf(",") + 1
            );

        };


      reader.onerror =
        () => {

          alert(
            "사진을 읽는 중 오류가 발생했어."
          );

          imageBase64 = null;
          imageMime = null;

        };


      reader.readAsDataURL(file);

    }
  );



/* =====================================================
   MAIN ANALYSIS
===================================================== */

async function runAnalysis() {

  const key =
    localStorage.getItem("API_KEY")
    ||
    document
      .getElementById("apiKey")
      .value
      .trim();


  if (!key) {

    alert(
      "Gemini API Key를 입력하고 저장해줘!"
    );

    return;

  }


  const memo =
    document
      .getElementById("memo")
      .value
      .trim();


  if (!memo && !imageBase64) {

    alert(
      "현장 상황 메모 또는 사진을 입력해줘!"
    );

    return;

  }


  const btn =
    document.getElementById("runBtn");

  const status =
    document.getElementById("status");

  const resultArea =
    document.getElementById("resultArea");


  btn.disabled = true;

  resultArea.style.display = "none";

  status.style.color = "#2563eb";

  status.innerText =
    "🔎 현장 상황을 분석하고 있습니다...";


  try {


    /* ---------------------------------------------
       USER PARTS
    --------------------------------------------- */

    const parts = [];


    if (memo) {

      parts.push({

        text:
`INSPECTION OBSERVATION:

${memo}

Analyze this field observation as an Environmental Health food inspection finding.

Use TB MED 530 food sanitation principles.

Return a concise professional inspection finding.

IMPORTANT:
Do not invent a TB MED 530 paragraph or section number.
If the exact regulatory citation cannot be determined with confidence, state:
"TB MED 530 – verify exact section."

DEF must describe only the observed deficiency.

REC must clearly state the corrective action.

Use professional U.S. Army Environmental Health inspection language.`

      });

    }


    if (imageBase64) {

      parts.push({

        inline_data: {

          mime_type:
            imageMime || "image/jpeg",

          data:
            imageBase64

        }

      });

    }



    /* ---------------------------------------------
       REQUEST BODY
    --------------------------------------------- */

    const requestBody = {

      system_instruction: {

        parts: [

          {

            text:
`You are an Environmental Health inspection writing assistant.

Your job is to convert field observations into professional food sanitation inspection findings.

Primary regulatory framework:
TB MED 530.

Never fabricate regulation paragraph numbers.

If an exact regulatory reference cannot be verified from the information available, use:
"TB MED 530 – verify exact section."

Write in concise professional inspection English suitable for an Environmental Health inspection report.

Return ONLY valid JSON matching the requested schema.

Do not include Markdown.
Do not include code fences.
Do not add commentary outside the JSON.`

          }

        ]

      },


      contents: [

        {

          role: "user",

          parts: parts

        }

      ],


      generationConfig: {

        temperature: 0.2,

        responseMimeType:
          "application/json",

        responseSchema: {

          type: "OBJECT",

          properties: {

            ref: {
              type: "STRING"
            },

            def: {
              type: "STRING"
            },

            rec: {
              type: "STRING"
            }

          },

          required: [
            "ref",
            "def",
            "rec"
          ]

        }

      }

    };



    /* ---------------------------------------------
       GEMINI API
    --------------------------------------------- */

    const model =
      "gemini-2.5-flash";


    const url =
      "https://generativelanguage.googleapis.com/v1beta/models/"
      + model
      + ":generateContent?key="
      + encodeURIComponent(key);



    const response =
      await fetch(
        url,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(
              requestBody
            )

        }
      );



    /* ---------------------------------------------
       HTTP ERROR
    --------------------------------------------- */

    if (!response.ok) {

      let message =
        "Gemini API 요청에 실패했습니다.";


      try {

        const errorData =
          await response.json();


        if (
          errorData &&
          errorData.error &&
          errorData.error.message
        ) {

          message =
            errorData.error.message;

        }

      }

      catch (e) {

        /* ignore JSON parse error */

      }


      throw new Error(
        message
      );

    }



    /* ---------------------------------------------
       RESPONSE
    --------------------------------------------- */

    const data =
      await response.json();


    const candidate =
      data?.candidates?.[0];


    if (!candidate) {

      throw new Error(
        "Gemini에서 분석 결과를 반환하지 않았습니다."
      );

    }


    const responseParts =
      candidate?.content?.parts;


    if (
      !responseParts ||
      !responseParts.length
    ) {

      throw new Error(
        "Gemini 응답 내용이 비어 있습니다."
      );

    }


    const outputText =
      responseParts
        .map(
          part =>
            part.text || ""
        )
        .join("")
        .trim();


    if (!outputText) {

      throw new Error(
        "분석 결과가 비어 있습니다."
      );

    }



    /* ---------------------------------------------
       PARSE JSON
    --------------------------------------------- */

    let result;


    try {

      result =
        JSON.parse(
          outputText
        );

    }

    catch (e) {

      console.error(
        "RAW GEMINI RESPONSE:",
        outputText
      );

      throw new Error(
        "Gemini 결과를 읽을 수 없습니다."
      );

    }



    /* ---------------------------------------------
       SHOW RESULT
    --------------------------------------------- */

    document
      .getElementById("outRef")
      .innerText =
        result.ref ||
        "TB MED 530 – verify exact section.";


    document
      .getElementById("outDef")
      .innerText =
        result.def ||
        "No deficiency generated.";


    document
      .getElementById("outRec")
      .innerText =
        result.rec ||
        "No recommendation generated.";


    resultArea.style.display =
      "block";


    status.style.color =
      "#16a34a";


    status.innerText =
      "✅ 분석 완료";


  }


  /* =================================================
     ERROR
  ================================================= */

  catch (error) {

    console.error(error);


    status.style.color =
      "#dc2626";


    let msg =
      error.message ||
      "알 수 없는 오류가 발생했습니다.";


    /* 너무 긴 Gemini 오류 방지 */

    if (msg.length > 300) {

      msg =
        msg.substring(0, 300)
        + "...";

    }


    status.innerText =
      "❌ 분석 실패\n" + msg;

  }


  finally {

    btn.disabled = false;

  }

}



/* =====================================================
   COPY
===================================================== */

async function copyAll() {

  const ref =
    document
      .getElementById("outRef")
      .innerText;


  const def =
    document
      .getElementById("outDef")
      .innerText;


  const rec =
    document
      .getElementById("outRec")
      .innerText;


  const text =
`REF: ${ref}

DEF: ${def}

REC: ${rec}`;


  try {

    await navigator.clipboard.writeText(
      text
    );


    alert(
      "REF / DEF / REC가 복사되었어!"
    );

  }

  catch (error) {

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      text;


    document.body.appendChild(
      textarea
    );


    textarea.select();


    document.execCommand(
      "copy"
    );


    document.body.removeChild(
      textarea
    );


    alert(
      "REF / DEF / REC가 복사되었어!"
    );

  }

}

</script>

</body>
</html>
