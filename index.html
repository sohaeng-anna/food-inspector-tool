<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TB MED 530 Inspector Tool</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 15px;
      background: #f8fafc;
    }

    h2 {
      text-align: center;
      color: #1e3a8a;
      margin-bottom: 18px;
    }

    .box {
      background: white;
      padding: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-top: 8px;
    }

    input,
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 15px;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    button {
      border: none;
      background: #1e3a8a;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .key-row {
      display: flex;
      gap: 6px;
    }

    .key-row button {
      width: 70px;
    }

    .small {
      font-size: 11px;
      color: #64748b;
      margin-top: 7px;
    }

    #status {
      text-align: center;
      font-size: 13px;
      margin-top: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #resultArea {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 6px;
    }

    .title {
      font-size: 13px;
      font-weight: bold;
      margin-top: 12px;
      color: #475569;
    }

    .def-title {
      color: #dc2626;
    }

    .rec-title {
      color: #16a34a;
    }

    .result {
      background: white;
      border: 1px solid #e2e8f0;
      padding: 10px;
      border-radius: 5px;
      margin-top: 4px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .copy-btn {
      background: #334155;
      margin-top: 15px;
    }
  </style>
</head>


<body>

<h2>📋 TB MED 530 Inspector Tool</h2>


<!-- API KEY -->

<div class="box">

  <label>
    <b>Gemini API Key:</b>
  </label>

  <div class="key-row">

    <input
      type="password"
      id="apiKey"
      placeholder="Google AI Studio API Key"
    >

    <button onclick="saveKey()">
      저장
    </button>

  </div>

  <div class="small">
    API Key는 현재 브라우저의 localStorage에 저장됩니다.
  </div>

</div>



<!-- INSPECTION -->

<div class="box">

  <label>
    <b>현장 상황 메모:</b>
  </label>

  <textarea
    id="memo"
    placeholder="예: 냉장고 온도가 45°F"
  ></textarea>


  <label>
    <b>현장 사진 첨부 (선택):</b>
  </label>

  <input
    type="file"
    id="pic"
    accept="image/jpeg,image/png,image/webp,image/heic,image/heif"
    capture="environment"
  >


  <button
    id="runBtn"
    onclick="runAnalysis()"
  >
    DEF / REC 생성하기
  </button>


  <div id="status"></div>



  <!-- RESULT -->

  <div id="resultArea">

    <div class="title">
      REF (Reference)
    </div>

    <div
      class="result"
      id="outRef"
    ></div>


    <div class="title def-title">
      DEF (Deficiency)
    </div>

    <div
      class="result"
      id="outDef"
    ></div>


    <div class="title rec-title">
      REC (Recommendation)
    </div>

    <div
      class="result"
      id="outRec"
    ></div>


    <button
      class="copy-btn"
      onclick="copyAll()"
    >
      전체 영문 복사
    </button>

  </div>

</div>



<script>

/* =====================================================
   SETTINGS
===================================================== */

const MODEL = "gemini-3.8-flash";

const API_URL =
  "https://generativelanguage.googleapis.com/v1beta/interactions";



/* =====================================================
   API KEY
===================================================== */

document.addEventListener("DOMContentLoaded", function () {

  const savedKey =
    localStorage.getItem("API_KEY");

  if (savedKey) {

    document.getElementById("apiKey").value =
      savedKey;

  }

});


function saveKey() {

  const key =
    document
      .getElementById("apiKey")
      .value
      .trim();


  if (!key) {

    alert("API Key를 입력해줘!");

    return;

  }


  localStorage.setItem(
    "API_KEY",
    key
  );


  alert("API Key가 저장되었어!");

}



/* =====================================================
   IMAGE
===================================================== */

let imageBase64 = null;
let imageMime = null;


document
  .getElementById("pic")
  .addEventListener(
    "change",
    function (event) {

      imageBase64 = null;
      imageMime = null;


      const file =
        event.target.files[0];


      if (!file) {
        return;
      }


      const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp",
        "image/heic",
        "image/heif"
      ];


      if (!allowedTypes.includes(file.type)) {

        alert(
          "JPG, PNG, WEBP, HEIC 이미지 파일을 사용해줘."
        );

        event.target.value = "";

        return;

      }


      if (file.size > 8 * 1024 * 1024) {

        alert(
          "사진은 8MB 이하로 사용해줘."
        );

        event.target.value = "";

        return;

      }


      imageMime =
        file.type;


      const reader =
        new FileReader();


      reader.onload =
        function (e) {

          const dataUrl =
            e.target.result;


          imageBase64 =
            dataUrl.split(",")[1];

        };


      reader.onerror =
        function () {

          imageBase64 = null;
          imageMime = null;

          alert(
            "사진을 읽는 중 오류가 발생했어."
          );

        };


      reader.readAsDataURL(file);

    }
  );



/* =====================================================
   RUN ANALYSIS
===================================================== */

async function runAnalysis() {

  const key =
    localStorage.getItem("API_KEY")
    ||
    document
      .getElementById("apiKey")
      .value
      .trim();


  if (!key) {

    alert(
      "Gemini API Key를 입력하고 저장해줘!"
    );

    return;

  }


  const memo =
    document
      .getElementById("memo")
      .value
      .trim();


  if (!memo && !imageBase64) {

    alert(
      "현장 상황 메모 또는 사진을 넣어줘!"
    );

    return;

  }



  const button =
    document.getElementById("runBtn");


  const status =
    document.getElementById("status");


  const resultArea =
    document.getElementById("resultArea");



  button.disabled = true;

  resultArea.style.display =
    "none";


  status.style.color =
    "#2563eb";


  status.innerText =
    "🔎 Gemini 3.8 Flash가 현장 상황을 분석 중입니다...";



  try {


    /* =================================================
       PROMPT
    ================================================= */

    const prompt = `

You are assisting a U.S. Army Environmental Health Technician
conducting a food sanitation inspection.

Analyze the inspection observation using food safety principles
applicable to TB MED 530.

FIELD OBSERVATION:

${memo || "Analyze the attached inspection photograph."}


Generate the following three fields.


REF:

Identify the applicable TB MED 530 regulatory reference.

IMPORTANT:

Do NOT fabricate or guess a paragraph number, section number,
chapter number, table number, or regulatory citation.

If the exact TB MED 530 citation cannot be determined with
confidence from the information available, write exactly:

TB MED 530 – verify exact section.


DEF:

Write a concise professional deficiency statement suitable
for a U.S. Army Environmental Health inspection report.

Describe only the condition actually reported by the inspector
or clearly visible in the photograph.

Do not invent temperatures, food types, dates, times,
equipment conditions, employee actions, or other facts.


REC:

Write a concise professional recommendation explaining
the corrective action required.

Use clear professional inspection language.

The DEF and REC should be suitable for direct copying
into an inspection report.

`;



    /* =================================================
       INPUT
    ================================================= */

    const input = [

      {
        type: "text",
        text: prompt
      }

    ];



    if (imageBase64) {

      input.push({

        type: "image",

        data: imageBase64,

        mime_type: imageMime

      });

    }



    /* =================================================
       STRUCTURED OUTPUT
    ================================================= */

    const requestBody = {

      model: MODEL,

      input: input,


      response_format: {

        type: "text",

        mime_type:
          "application/json",

        schema: {

          type: "object",

          properties: {

            ref: {
              type: "string"
            },

            def: {
              type: "string"
            },

            rec: {
              type: "string"
            }

          },

          required: [
            "ref",
            "def",
            "rec"
          ]

        }

      }

    };



    /* =================================================
       CALL GEMINI
    ================================================= */

    console.log(
      "Calling model:",
      MODEL
    );


    console.log(
      "Calling API:",
      API_URL
    );



    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "x-goog-api-key":
              key

          },

          body:
            JSON.stringify(
              requestBody
            )

        }
      );



    /* =================================================
       API ERROR
    ================================================= */

    if (!response.ok) {

      let errorMessage =
        "Gemini API 요청에 실패했습니다.";


      try {

        const errorData =
          await response.json();


        console.error(
          "Gemini API error:",
          errorData
        );


        if (
          errorData &&
          errorData.error &&
          errorData.error.message
        ) {

          errorMessage =
            errorData.error.message;

        }

      }

      catch (parseError) {

        console.error(
          parseError
        );

      }


      throw new Error(
        errorMessage
      );

    }



    /* =================================================
       READ RESPONSE
    ================================================= */

    const data =
      await response.json();


    console.log(
      "Gemini response:",
      data
    );



    /*
      REST Interactions API는
      SDK의 output_text convenience property와 달리
      전체 Interaction resource를 반환할 수 있으므로
      steps의 model_output에서 최종 text를 읽는다.
    */


    let outputText = "";


    if (
      typeof data.output_text === "string"
      &&
      data.output_text.trim()
    ) {

      outputText =
        data.output_text.trim();

    }



    if (
      !outputText
      &&
      Array.isArray(data.steps)
    ) {

      const textParts = [];


      for (const step of data.steps) {

        if (
          step &&
          step.type === "model_output"
          &&
          Array.isArray(step.content)
        ) {

          for (const content of step.content) {

            if (
              content &&
              content.type === "text"
              &&
              typeof content.text === "string"
            ) {

              textParts.push(
                content.text
              );

            }

          }

        }

      }


      outputText =
        textParts
          .join("")
          .trim();

    }



    if (!outputText) {

      throw new Error(
        "Gemini가 분석 결과를 반환하지 않았습니다."
      );

    }



    /* =================================================
       PARSE JSON
    ================================================= */

    let result;


    try {

      result =
        JSON.parse(
          outputText
        );

    }

    catch (error) {

      console.error(
        "Gemini raw output:",
        outputText
      );


      throw new Error(
        "Gemini 응답을 JSON으로 읽을 수 없습니다."
      );

    }



    /* =================================================
       DISPLAY
    ================================================= */

    document
      .getElementById("outRef")
      .innerText =
        result.ref
        ||
        "TB MED 530 – verify exact section.";



    document
      .getElementById("outDef")
      .innerText =
        result.def
        ||
        "No deficiency generated.";



    document
      .getElementById("outRec")
      .innerText =
        result.rec
        ||
        "No recommendation generated.";



    resultArea.style.display =
      "block";


    status.style.color =
      "#16a34a";


    status.innerText =
      "✅ 분석 완료";


  }



  /* ===================================================
     ERROR
  =================================================== */

  catch (error) {


    console.error(
      "Inspector Tool Error:",
      error
    );


    status.style.color =
      "#dc2626";


    let message =
      error.message
      ||
      "알 수 없는 오류가 발생했습니다.";



    if (message.length > 500) {

      message =
        message.substring(0, 500)
        +
        "...";

    }



    status.innerText =
      "❌ 분석 실패\n"
      +
      message;

  }



  finally {

    button.disabled =
      false;

  }

}



/* =====================================================
   COPY
===================================================== */

async function copyAll() {

  const ref =
    document
      .getElementById("outRef")
      .innerText;


  const def =
    document
      .getElementById("outDef")
      .innerText;


  const rec =
    document
      .getElementById("outRec")
      .innerText;



  const text =
`REF: ${ref}

DEF: ${def}

REC: ${rec}`;



  try {

    await navigator
      .clipboard
      .writeText(text);


    alert(
      "REF / DEF / REC가 복사되었어!"
    );

  }


  catch (error) {


    const temp =
      document.createElement(
        "textarea"
      );


    temp.value =
      text;


    document.body.appendChild(
      temp
    );


    temp.select();


    document.execCommand(
      "copy"
    );


    document.body.removeChild(
      temp
    );


    alert(
      "REF / DEF / REC가 복사되었어!"
    );

  }

}

</script>

</body>
</html>
