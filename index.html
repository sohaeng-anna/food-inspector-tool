<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>TB MED 530 Inspector Tool</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 15px;
      max-width: 600px;
      margin: 0 auto;
      background: #f8fafc;
    }

    h2 {
      color: #1e3a8a;
      text-align: center;
      margin-bottom: 15px;
    }

    .box {
      background: white;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      margin-bottom: 12px;
    }

    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 15px;
    }

    textarea {
      height: 90px;
      resize: vertical;
    }

    button {
      background: #1e3a8a;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 10px;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .res-box {
      display: none;
      background: #f1f5f9;
      padding: 12px;
      border-radius: 6px;
      margin-top: 12px;
    }

    .res-title {
      font-weight: bold;
      margin-top: 10px;
      font-size: 13px;
      color: #475569;
    }

    .res-val {
      background: white;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
      font-size: 14px;
      margin-top: 3px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .btn-copy {
      background: #334155;
      margin-top: 14px;
    }

    #status {
      text-align: center;
      color: #2563eb;
      font-size: 13px;
      margin-top: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .small {
      font-size: 11px;
      color: #64748b;
      margin-top: 7px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

<h2>📋 TB MED 530 Inspector Tool</h2>

<div class="box">

  <label><b>Gemini API Key:</b></label>

  <div style="display:flex; gap:6px;">
    <input
      type="password"
      id="apiKey"
      placeholder="Google AI Studio API Key"
    >

    <button
      onclick="saveKey()"
      style="width:70px; margin-top:6px; background:#475569;"
    >
      저장
    </button>
  </div>

  <div class="small">
    API Key는 이 브라우저에만 저장됩니다.
  </div>

</div>


<div class="box">

  <label><b>현장 상황 메모:</b></label>

  <textarea
    id="memo"
    placeholder="예: RIF 온도가 화씨 45도임"
  ></textarea>


  <label style="margin-top:10px; display:block;">
    <b>현장 사진 첨부 (선택):</b>
  </label>

  <input
    type="file"
    id="pic"
    accept="image/*"
    capture="environment"
  >


  <button
    id="runBtn"
    onclick="runAnalysis()"
  >
    DEF / REC 생성하기
  </button>


  <div id="status"></div>


  <div
    class="res-box"
    id="resultArea"
  >

    <div class="res-title">
      REF (Reference)
    </div>

    <div
      class="res-val"
      id="outRef"
    ></div>


    <div
      class="res-title"
      style="color:#dc2626;"
    >
      DEF (Deficiency)
    </div>

    <div
      class="res-val"
      id="outDef"
    ></div>


    <div
      class="res-title"
      style="color:#16a34a;"
    >
      REC (Recommendation)
    </div>

    <div
      class="res-val"
      id="outRec"
    ></div>


    <button
      class="btn-copy"
      onclick="copyAll()"
    >
      전체 영문 복사
    </button>

  </div>

</div>


<script>

/* ============================================
   API KEY
============================================ */

document.addEventListener("DOMContentLoaded", () => {

  const saved =
    localStorage.getItem("API_KEY");

  if (saved) {
    document.getElementById("apiKey").value = saved;
  }

});


function saveKey() {

  const key =
    document.getElementById("apiKey").value.trim();

  if (!key) {
    alert("API Key를 입력해줘!");
    return;
  }

  localStorage.setItem("API_KEY", key);

  alert("API Key가 저장되었어!");

}


/* ============================================
   IMAGE
============================================ */

let imageBase64 = null;
let imageMime = null;


document.getElementById("pic")
.addEventListener("change", function(event) {

  const file = event.target.files[0];

  imageBase64 = null;
  imageMime = null;

  if (!file) return;


  if (!file.type.startsWith("image/")) {

    alert("이미지 파일만 첨부할 수 있어.");

    event.target.value = "";

    return;
  }


  /*
    Interactions API inline 요청 전체가
    너무 커지는 것을 방지
  */

  if (file.size > 8 * 1024 * 1024) {

    alert("사진은 8MB 이하로 사용해줘.");

    event.target.value = "";

    return;
  }


  imageMime = file.type || "image/jpeg";


  const reader = new FileReader();


  reader.onload = function(e) {

    const dataUrl = e.target.result;

    imageBase64 =
      dataUrl.substring(
        dataUrl.indexOf(",") + 1
      );

  };


  reader.onerror = function() {

    imageBase64 = null;
    imageMime = null;

    alert("사진을 읽을 수 없어.");

  };


  reader.readAsDataURL(file);

});


/* ============================================
   ANALYSIS
============================================ */

async function runAnalysis() {

  const key =
    localStorage.getItem("API_KEY")
    ||
    document.getElementById("apiKey").value.trim();


  if (!key) {

    alert("Gemini API Key를 입력하고 저장해줘!");

    return;

  }


  const memo =
    document.getElementById("memo").value.trim();


  if (!memo && !imageBase64) {

    alert("현장 상황 메모 또는 사진을 넣어줘!");

    return;

  }


  const btn =
    document.getElementById("runBtn");

  const status =
    document.getElementById("status");

  const resultArea =
    document.getElementById("resultArea");


  btn.disabled = true;

  resultArea.style.display = "none";

  status.style.color = "#2563eb";

  status.innerText =
    "🔎 Gemini 3.8 Flash가 현장 상황을 분석 중입니다...";


  try {


    /* ========================================
       PROMPT
    ======================================== */

    const prompt = `
You are assisting a U.S. Army Environmental Health Technician
conducting a food sanitation inspection.

Analyze the field observation using food safety principles
applicable to TB MED 530.

FIELD OBSERVATION:
${memo || "See attached inspection photograph."}

Your task is to produce three items:

1. REF
Provide the applicable TB MED 530 reference.

IMPORTANT:
Never fabricate a paragraph, section, chapter, table,
or regulatory citation.

If you cannot determine the exact TB MED 530 citation
with confidence from the information provided,
write exactly:

TB MED 530 – verify exact section.

2. DEF
Write a concise professional deficiency statement
appropriate for an Environmental Health inspection report.

Describe what was actually observed.

Do not invent facts that were not supplied by the inspector
or clearly visible in the photograph.

3. REC
Write a concise professional recommendation describing
the corrective action required.

Use professional U.S. Army Environmental Health
inspection language.

Keep DEF and REC concise and suitable for direct
copying into an inspection report.
`;


    /* ========================================
       INTERACTIONS INPUT
    ======================================== */

    const input = [

      {
        type: "text",
        text: prompt
      }

    ];


    /*
      사진이 있으면 Interactions API의
      inline image 형식으로 추가
    */

    if (imageBase64) {

      input.push({

        type: "image",

        data: imageBase64,

        mime_type:
          imageMime || "image/jpeg"

      });

    }


    /* ========================================
       REQUEST BODY
    ======================================== */

    const body = {

      model: "gemini-3.8-flash",

      input: input,

      system_instruction:
        `You are a professional Environmental Health
inspection writing assistant.

Your primary task is to help prepare concise food sanitation
inspection findings.

Never fabricate regulatory citations.

Do not assume facts that are not contained in the inspector's
observation or clearly visible in an attached photograph.

Return only the requested structured JSON response.`,


      generation_config: {

        temperature: 0.2

      },


      response_format: {

        type: "text",

        mime_type: "application/json",

        schema: {

          type: "object",

          properties: {

            ref: {
              type: "string",
              description:
                "Applicable TB MED 530 reference."
            },

            def: {
              type: "string",
              description:
                "Professional deficiency statement."
            },

            rec: {
              type: "string",
              description:
                "Professional corrective recommendation."
            }

          },

          required: [
            "ref",
            "def",
            "rec"
          ],

          additionalProperties: false

        }

      }

    };


    /* ========================================
       INTERACTIONS API
    ======================================== */

    const response =
      await fetch(
        "https://generativelanguage.googleapis.com/v1beta/interactions",
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "x-goog-api-key":
              key

          },

          body:
            JSON.stringify(body)

        }
      );


    /* ========================================
       ERROR RESPONSE
    ======================================== */

    if (!response.ok) {

      let errorMessage =
        "Gemini API 요청에 실패했습니다.";


      try {

        const errorData =
          await response.json();


        if (
          errorData &&
          errorData.error &&
          errorData.error.message
        ) {

          errorMessage =
            errorData.error.message;

        }

      }

      catch (e) {

        // JSON 오류 응답이 아닌 경우

      }


      throw new Error(errorMessage);

    }


    /* ========================================
       RESPONSE
    ======================================== */

    const data =
      await response.json();


    console.log(
      "Gemini interaction response:",
      data
    );


    /*
      Interactions API는 output_text를 반환한다.
    */

    let outputText =
      data.output_text || "";


    /*
      혹시 output_text가 없는 응답 형태에 대비해서
      steps 안의 model_output text도 확인한다.
    */

    if (!outputText && Array.isArray(data.steps)) {

      const texts = [];


      for (const step of data.steps) {

        if (!step) continue;


        if (
          step.type === "model_output" &&
          Array.isArray(step.content)
        ) {

          for (const item of step.content) {

            if (
              item &&
              item.type === "text" &&
              item.text
            ) {

              texts.push(item.text);

            }

          }

        }

      }


      outputText = texts.join("");

    }


    if (!outputText) {

      throw new Error(
        "Gemini가 분석 결과를 반환하지 않았습니다."
      );

    }


    /* ========================================
       JSON PARSE
    ======================================== */

    let result;


    try {

      result =
        JSON.parse(outputText);

    }

    catch (e) {

      console.error(
        "RAW OUTPUT:",
        outputText
      );

      throw new Error(
        "Gemini 결과를 JSON으로 읽을 수 없습니다."
      );

    }


    /* ========================================
       RESULT
    ======================================== */

    const ref =
      result.ref ||
      "TB MED 530 – verify exact section.";


    const def =
      result.def ||
      "No deficiency generated.";


    const rec =
      result.rec ||
      "No recommendation generated.";


    document.getElementById("outRef").innerText =
      ref;

    document.getElementById("outDef").innerText =
      def;

    document.getElementById("outRec").innerText =
      rec;


    resultArea.style.display =
      "block";


    status.style.color =
      "#16a34a";


    status.innerText =
      "✅ 분석 완료";


  }

  catch (error) {

    console.error(error);


    status.style.color =
      "#dc2626";


    let message =
      error.message ||
      "알 수 없는 오류가 발생했습니다.";


    /*
      화면에 엄청 긴 API 오류가 출력되는 것 방지
    */

    if (message.length > 400) {

      message =
        message.substring(0, 400)
        + "...";

    }


    status.innerText =
      "❌ 분석 실패\n" +
      message;

  }

  finally {

    btn.disabled = false;

  }

}


/* ============================================
   COPY RESULT
============================================ */

async function copyAll() {

  const ref =
    document.getElementById("outRef").innerText;

  const def =
    document.getElementById("outDef").innerText;

  const rec =
    document.getElementById("outRec").innerText;


  const text =
`REF: ${ref}

DEF: ${def}

REC: ${rec}`;


  try {

    await navigator.clipboard.writeText(text);

    alert("REF / DEF / REC가 복사되었어!");

  }

  catch (error) {

    const temp =
      document.createElement("textarea");

    temp.value = text;

    document.body.appendChild(temp);

    temp.select();

    document.execCommand("copy");

    document.body.removeChild(temp);

    alert("REF / DEF / REC가 복사되었어!");

  }

}

</script>

</body>
</html>
